{% extends 'admin_nav.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">


{% if error == "no" %}
     <script>
	   alert('Doctor Record has been Updated');
       window.location.href="{% url 'view_doctor' %}";
     </script>
{% endif %}

{% if error == "yes" %}
     <script>
	    alert('Something went wrong, Try Again');
     </script>
{% endif %}

<div class="container card shadow">
		<div class="card-body">
			<h5 class="p-2" style="border-bottom: 2px solid orange">Edit Doctors</h5>
             <br>
			<div class="container-fluid">
				<form method="post">
                    {% csrf_token %}
					<div class="form-row">

						<div class="col-sm-12">
							<div class="form-group">
								<label>Doctor Name</label>
								<input type="text" name="name" class="form-control" value="{{doctor.name}}" required>
							</div>
						</div>

                    	<div class="col-sm-12">
							<div class="form-group">
								<label>Contact Number</label>
								<input type="text" name="mobile" class="form-control" value="{{doctor.mobile}}" required>
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Specialization</label>
								<input type="text" name="special" class="form-control" value="{{doctor.special}}" required>
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Department</label>
								<select name="department" class="form-control">
									<option {% if doctor.department == "Cardiology" %}selected{% endif %}>Cardiology</option>
									<option {% if doctor.department == "Neurology" %}selected{% endif %}>Neurology</option>
									<option {% if doctor.department == "Orthopedics" %}selected{% endif %}>Orthopedics</option>
									<option {% if doctor.department == "Pediatrics" %}selected{% endif %}>Pediatrics</option>
									<option {% if doctor.department == "General Medicine" %}selected{% endif %}>General Medicine</option>
								</select>
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Qualification</label>
								<input type="text" name="qualification" class="form-control" value="{{doctor.qualification}}">
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Availability</label>
								<select name="availability" class="form-control">
									<option {% if doctor.availability == "Available" %}selected{% endif %}>Available</option>
									<option {% if doctor.availability == "On Duty" %}selected{% endif %}>On Duty</option>
									<option {% if doctor.availability == "Unavailable" %}selected{% endif %}>Unavailable</option>
								</select>
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Assigned Patients</label>
								<input type="number" name="assigned_patients" class="form-control" value="{{doctor.assigned_patients}}" min="0">
							</div>
						</div>

                      </div>

					<hr>
					<input type="submit" value="Update" class="btn btn-primary">
				</form>
			</div>
		</div>
	</div>

</body>
</html>
{% endblock content %}

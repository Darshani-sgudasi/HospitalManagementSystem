{% extends "admin_nav.html" %}
{% load static %}
{% block content %}

<style>
  .admin-dashboard-bg {
    min-height: calc(100vh - 40px);
    padding: 2rem 2rem 3rem;
    background-image: url("{% static 'images/admin_home1.jpg' %}");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    position: relative;
    overflow: hidden;
  }

  .admin-dashboard-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, rgba(86, 182, 255, 0.35), transparent 25%),
      radial-gradient(circle at bottom left, rgba(77, 221, 165, 0.35), transparent 22%);
    pointer-events: none;
  }

  .dashboard-page,
  .admin-dashboard-bg > * {
    position: relative;
    z-index: 1;
  }

  .dashboard-hero {
    border-radius: 30px;
    padding: 2rem;
    background: rgba(5, 19, 42, 0.74);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.22);
    margin-bottom: 2rem;
  }

  .hero-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    align-items: stretch;
  }

  .hero-text {
    flex: 1 1 420px;
    min-width: 280px;
  }

  .hero-badge {
    display: inline-flex;
    padding: 0.75rem 1.2rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    color: #b8d4ff;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .hero-headline {
    color: #fff;
    font-size: clamp(2.75rem, 5vw, 4.2rem);
    line-height: 1.02;
    margin: 1rem 0 1rem;
  }

  .hero-text p {
    color: rgba(255, 255, 255, 0.82);
    font-size: 1.05rem;
    max-width: 720px;
    margin-bottom: 1.5rem;
  }

  .hero-actions a {
    margin-right: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .btn-hero,
  .btn-hero-outline {
    border-radius: 999px;
    font-weight: 700;
    padding: 0.95rem 1.6rem;
    min-width: 170px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .btn-hero:hover,
  .btn-hero-outline:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 40px rgba(64, 128, 255, 0.18);
  }

  .btn-hero {
    background: linear-gradient(135deg, #5d8def, #38b8ff);
    border: none;
    color: #fff;
  }

  .btn-hero-outline {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.24);
    color: #edf2ff;
  }

  .hero-stats {
    display: grid;
    gap: 1rem;
    grid-template-columns: repeat(1, minmax(0, 1fr));
    width: 320px;
  }

  @media (min-width: 850px) {
    .hero-stats {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      width: auto;
    }
  }

  .hero-stat {
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 1.35rem 1.2rem;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: transform 0.25s ease, background 0.25s ease;
  }

  .hero-stat:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.12);
  }

  .hero-stat span {
    display: block;
    font-size: 2.25rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: 0.35rem;
  }

  .hero-stat small {
    color: rgba(255, 255, 255, 0.72);
    font-size: 0.95rem;
  }

  .market-updates {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  .market-update-block {
    padding: 2rem 1.8rem;
    border-radius: 28px;
    color: #fff;
    min-height: 190px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 30px 90px rgba(3, 13, 33, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  }

  .market-update-block:hover {
    transform: translateY(-6px);
    box-shadow: 0 35px 110px rgba(8, 27, 57, 0.28);
    filter: saturate(1.05);
  }

  .market-update-block h3 {
    font-size: 3rem;
    margin: 0;
    letter-spacing: -0.04em;
  }

  .market-update-block h4 {
    font-size: 1.05rem;
    margin: 0.6rem 0 0;
    opacity: 0.92;
  }

  .market-update-block a {
    color: inherit;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 100%;
    padding: -2rem -1.8rem;
  }

  .market-update-block a:hover {
    text-decoration: none;
  }

  .market-update-left {
    padding: 0;
  }

  .market-update-right i {
    font-size: 3.1rem;
    width: 78px;
    height: 78px;
    background: rgba(255, 255, 255, 0.14);
    display: grid;
    place-items: center;
    border-radius: 50%;
  }

  .clr-block-1 {
    background: linear-gradient(130deg, #43cea2, #185a9d);
  }

  .clr-block-2 {
    background: linear-gradient(130deg, #f093fb, #f5576c);
  }

  .clr-block-3 {
    background: linear-gradient(130deg, #34e89e, #0f3443);
  }

  .clr-block-1:hover,
  .clr-block-2:hover,
  .clr-block-3:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .market-update-right i.fa-user-md {
    color: #ffdd57;
  }

  .market-update-right i.fa-user-o {
    color: #7afcff;
  }

  .market-update-right i.fa-calendar {
    color: #4cc9f0;
  }

  .dashboard-footer {
    text-align: center;
    margin-top: 2.5rem;
    padding: 1.5rem 1rem;
    color: rgba(255, 255, 255, 0.78);
    font-size: 0.96rem;
  }

  .dashboard-footer strong {
    color: #ffffff;
  }
</style>

  <section class="market-updates">
    <div class="market-update-block clr-block-1">
      <a href="{% url 'view_doctor' %}">
        <div class="market-update-left">
          <h3>{{dc}}</h3>
          <h4>Total Doctors</h4>
        </div>
        <div class="market-update-right">
          <i class="fa fa-user-md"></i>
        </div>
      </a>
    </div>

    <div class="market-update-block clr-block-2">
      <a href="{% url 'view_patient' %}">
        <div class="market-update-left">
          <h3>{{pc}}</h3>
          <h4>Total Patients</h4>
        </div>
        <div class="market-update-right">
          <i class="fa fa-user-o"></i>
        </div>
      </a>
    </div>

    <div class="market-update-block clr-block-3">
      <a href="{% url 'view_appointment' %}">
        <div class="market-update-left">
          <h3>{{ac}}</h3>
          <h4>Total Appointments</h4>
        </div>
        <div class="market-update-right">
          <i class="fa fa-calendar"></i>
        </div>
      </a>
    </div>
  </section>

  <footer class="dashboard-footer">
    <p>Copyright &copy; <strong><script>document.write(new Date().getFullYear());</script></strong> All Rights Reserved | Made with heart by Pankaj Panjwani</p>
  </footer>

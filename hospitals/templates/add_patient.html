{% extends 'admin_nav.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">


{% if error == "no" %}
     <script>
	   alert('Record Save Successfully');
       window.location.href="{% url 'view_patient' %}";
     </script>
{% endif %}

{% if error == "yes" %}
     <script>
	    alert('Something went wrong, Try Again');
     </script>
{% endif %}

<div class="container card shadow">
		<div class="card-body">
			<h5 class="p-2" style="border-bottom: 2px solid orange">Add Patient</h5>
             <br>
			<div class="container-fluid">
				<form method="post">
                    {% csrf_token %}
					<div class="form-row">

						<div class="col-sm-12">
							<div class="form-group">
								<label>Patient Name</label>
								<input type="text" name="name" class="form-control" placeholder="Enter patient name" required>
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Age</label>
								<input type="number" name="age" class="form-control" placeholder="Enter patient age">
							</div>
						</div>

                    	<div class="col-sm-12">
							<div class="form-group">
								<label>Mobile Number</label>
								<input type="text" name="mobile" class="form-control" placeholder="Enter Ten Digit Mobile Number" required>
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Gender</label>
								<input type="radio" name="gender" value="Male"> Male
								<input type="radio" name="gender" value="Female"> Female
								<input type="radio" name="gender" value="other"> other
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Blood Group</label>
								<select name="blood_group" class="form-control">
									<option value="">Select blood group</option>
									<option>A+</option><option>A-</option><option>B+</option><option>B-</option>
									<option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
								</select>
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Disease</label>
								<input type="text" name="disease" class="form-control" placeholder="Enter disease or diagnosis">
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Admission Date</label>
								<input type="date" name="admission_date" class="form-control">
							</div>
						</div>

						<div class="col-sm-12">
							<div class="form-group">
								<label>Address</label>
                                <textarea name="address" class="form-control" placeholder="Enter patient address" required></textarea>
							</div>
						</div>

                        <div class="col-sm-12">
                            <div class="form-group">
                                <label>Ward</label>
                                <select name="ward" class="form-control" >
                                    <option value="">Select ward</option>
                                    <option value="General Ward">General Ward</option>
                                    <option value="ICU">ICU</option>
                                    <option value="Emergency">Emergency</option>
                                    <option value="Pediatrics">Pediatrics</option>
                                    <option value="Maternity">Maternity</option>
                                    <option value="Private Room">Private Room</option>
                                    <option value="Private Room">None</option>
                                </select>
                            </div>
                        </div>

                    </div>
					<hr>
					<input type="submit" value="Submit" class="btn btn-primary">
				</form>
			</div>
		</div>
	</div>

{% endblock content %}
